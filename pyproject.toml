[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "model-workspace-knockout"
version = "0.1.0"
description = "Knocking out an LLM's J-space workspace, with and without chain of thought"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.5",   # matches the vendored jlens
    "datasets",
    "math-verify",
    "tqdm",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["jspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]
